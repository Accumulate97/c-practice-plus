    <title>c-practice-plus · C 语言与数据结构学习平台</title>
    <script>
      // 主题防闪烁：在首帧之前把 data-theme 打到 <html> 上
      try {
        var s = localStorage.getItem('cpractice:settings:v1')
        var p = s ? JSON.parse(s) : null
        // zustand persist 存的是 { state: { mode }, version }；旧版本用过 { theme }
        // 无存档时默认深色（任务07 §四：深色是站点身份，与 theme.ts 的默认值同口径）
        var t = (p && (p.state ? p.state.mode : p.theme)) || 'dark'
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
